name: Prerelease (Beta/Alpha)
on:
  push:
    branches: [develop]
    paths: ['packages/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag (beta, alpha, rc)'
        required: true
        default: 'beta'
        type: choice
        options:
          - 'beta'
          - 'alpha'
          - 'rc'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerelease:
    name: Create Prerelease
    runs-on: ubuntu-latest
    if: github.repository_owner == 'starfleet-technology'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: |
          echo "Running lint..."
          pnpm lint
          echo "Running tests..."
          pnpm test

      - name: Build packages
        run: pnpm build

      - name: Determine prerelease tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="beta"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using prerelease tag: $TAG"

      - name: Create snapshot changeset
        run: |
          # Generate timestamp for unique prerelease versions
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          TAG="${{ steps.tag.outputs.tag }}"

          echo "Creating snapshot changeset with tag: $TAG"
          cat > .changeset/prerelease-snapshot.md << EOF
          ---
          "@starfleet-technology/lcars": patch
          "@starfleet-technology/lcars-react": patch
          "@starfleet-technology/lcars-vue": patch
          ---

          Prerelease snapshot: $TAG release from develop branch
          EOF

      - name: Enter prerelease mode
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Entering prerelease mode with tag: $TAG"
          pnpm changeset pre enter $TAG

      - name: Version packages for prerelease
        run: |
          echo "Versioning packages for prerelease..."
          pnpm changeset version

          # Show what versions will be published
          echo "📦 Prerelease versions:"
          for pkg in lcars lcars-react lcars-vue; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            echo "  @starfleet-technology/$pkg: $version"
          done

      - name: Publish prerelease packages
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Publishing prerelease packages with tag: $TAG"
          pnpm changeset publish --tag $TAG
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Exit prerelease mode
        run: |
          echo "Exiting prerelease mode..."
          pnpm changeset pre exit

      - name: Create prerelease summary
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "## 🚀 Prerelease Published" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** $TAG" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Published Packages" >> $GITHUB_STEP_SUMMARY

          for pkg in lcars lcars-react lcars-vue; do
            if [ -f "packages/$pkg/package.json" ]; then
              version=$(node -p "require('./packages/$pkg/package.json').version")
              echo "- \`@starfleet-technology/$pkg@$version\`" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with: \`npm install @starfleet-technology/lcars@$TAG\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify about prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "✅ Prerelease packages published with tag: $TAG"
          echo "🔍 Check npm: https://www.npmjs.com/package/@starfleet-technology/lcars"
          echo "📦 Install: npm install @starfleet-technology/lcars@$TAG"
