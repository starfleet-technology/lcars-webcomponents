name: Manual Release
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '@starfleet-technology/lcars'
          - '@starfleet-technology/lcars-react'
          - '@starfleet-technology/lcars-vue'
      version-type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'prerelease'
      dry-run:
        description: 'Perform a dry run (no actual publishing)'
        required: false
        default: false
        type: boolean

concurrency:
  group: manual-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-release:
    name: Manual Package Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'starfleet-technology' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: |
          echo "Running lint..."
          pnpm lint
          echo "Running tests..."
          pnpm test
          echo "Building packages..."
          pnpm build

      - name: Validate build output
        run: |
          echo "Validating package builds..."
          for pkg in lcars lcars-react lcars-vue; do
            if [ ! -d "packages/$pkg/dist" ]; then
              echo "❌ Package $pkg build failed - no dist directory"
              exit 1
            fi
            echo "✅ Package $pkg built successfully"
          done

      - name: Create changeset for version bump
        if: github.event.inputs.package != 'all'
        run: |
          echo "Creating changeset for ${{ github.event.inputs.package }}..."
          cat > .changeset/manual-release.md << EOF
          ---
          "${{ github.event.inputs.package }}": ${{ github.event.inputs.version-type }}
          ---

          Manual release: ${{ github.event.inputs.version-type }} version bump for ${{ github.event.inputs.package }}
          EOF

      - name: Create changeset for all packages
        if: github.event.inputs.package == 'all'
        run: |
          echo "Creating changeset for all packages..."
          cat > .changeset/manual-release.md << EOF
          ---
          "@starfleet-technology/lcars": ${{ github.event.inputs.version-type }}
          "@starfleet-technology/lcars-react": ${{ github.event.inputs.version-type }}
          "@starfleet-technology/lcars-vue": ${{ github.event.inputs.version-type }}
          ---

          Manual release: ${{ github.event.inputs.version-type }} version bump for all packages
          EOF

      - name: Version packages (dry run)
        if: github.event.inputs.dry-run == 'true'
        run: |
          echo "🏃‍♂️ DRY RUN: Would version packages..."
          pnpm changeset version --verbose
          git diff --name-only
          echo "📦 Would publish these packages:"
          pnpm changeset status

      - name: Version and publish packages
        if: github.event.inputs.dry-run == 'false'
        run: |
          echo "📝 Versioning packages..."
          pnpm changeset version

          echo "📦 Publishing packages..."
          if [ "${{ github.event.inputs.package }}" = "all" ]; then
            pnpm changeset publish
          else
            pnpm publish --filter="${{ github.event.inputs.package }}" --access public
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version changes
        if: github.event.inputs.dry-run == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "chore: manual release ${{ github.event.inputs.version-type }} for ${{ github.event.inputs.package }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release summary
        run: |
          echo "## 🚀 Manual Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** ${{ github.event.inputs.package }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version Type:** ${{ github.event.inputs.version-type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ github.event.inputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
