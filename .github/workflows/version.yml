# 🚀 LCARS Web Components - Release & Publishing Pipeline
#
# This workflow handles automated versioning and publishing of LCARS packages to NPM.
# It provides human-in-the-loop controls for safe publishing with comprehensive validation.
#
# Workflow Features:
# - ✅ Automated changeset detection and version bumping
# - 🛡️ Manual approval gates for production releases
# - 📦 Multi-package publishing with proper dependency management
# - 🏷️ Automated GitHub release creation
# - 🤖 Direct publishing after merge (no intermediate PRs)
#
# Security Features:
# - Repository ownership validation
# - Manual trigger for publishing operations
# - Proper token management and permissions

name: Release

on:
  # Trigger only after CI passes on main — a failing CI blocks release
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

  # Manual trigger for publishing after approval
  workflow_dispatch:
    inputs:
      force_publish:
        description: '🚨 Force publish (requires admin approval)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Release Pipeline
  # ============================================================================
  # Purpose: Handle changeset analysis, version bumping, and publishing
  # Uses manual approval process for safe publishing
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent runaway jobs

    # Only run for starfleet-technology org, and only when CI passed (or explicit manual dispatch)
    if: |
      github.repository_owner == 'starfleet-technology' &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      )

    permissions:
      contents: write
      id-token: write

    steps:
      # ----------------------------------------
      # Environment Setup
      # ----------------------------------------
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4
        with:
          # Check out the branch so later git commit/push steps are not in detached HEAD.
          # For workflow_run use the branch that passed CI; for manual runs use the current ref.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: ✅ Validate commit matches successful CI run
        if: github.event_name == 'workflow_run'
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"

          echo "Checked out SHA:  ${ACTUAL_SHA}"
          echo "Expected SHA:     ${EXPECTED_SHA}"

          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "❌ Branch tip no longer matches the commit that passed CI."
            echo "A new commit may have landed on main between CI completing and this job starting."
            echo "Refusing to continue — re-run once the new commit has its own CI result."
            exit 1
          fi

          echo "✅ Commit SHA validated"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------
      # Manual Publishing Approval (for workflow_dispatch)
      # ----------------------------------------
      - name: 🛡️ Publishing Approval Checkpoint
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🚨 MANUAL PUBLISHING TRIGGERED"
          echo "🏷️ Repository: ${{ github.repository }}"
          echo "🌟 Branch: ${{ github.ref_name }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🚨 Force Publish: ${{ github.event.inputs.force_publish }}"
          echo ""
          echo "⚠️ This will publish packages to the public NPM registry."
          echo "✅ Proceeding with human approval confirmed."

      # ----------------------------------------
      # Publishing Safety Checks
      # ----------------------------------------
      - name: 🔐 Validate Publishing Environment
        run: |
          # Verify NPM token is available
          if [ -z "$NPM_TOKEN" ]; then
            echo "❌ NPM_TOKEN not configured for publishing"
            exit 1
          fi

          # For manual dispatch: ensure we're on the main branch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "❌ Publishing only allowed from main branch"
            exit 1
          fi

          echo "✅ Publishing environment validated"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ----------------------------------------
      # Changeset Detection
      # ----------------------------------------
      - name: 📋 Check for Changesets
        id: changeset_check
        run: |
          if ls .changeset/*.md 1> /dev/null 2>&1; then
            CHANGESET_COUNT=$(ls .changeset/*.md 2>/dev/null | grep -v README | wc -l)
            echo "📦 Found $CHANGESET_COUNT changeset(s)"
            echo "has_changesets=true" >> $GITHUB_OUTPUT

            # Show changeset status
            echo "🔍 Changeset status:"
            pnpm changeset status
          else
            echo "📝 No changesets found"
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------
      # Version Packages (if changesets exist)
      # ----------------------------------------
      - name: 📊 Apply Version Updates
        id: version_update
        if: steps.changeset_check.outputs.has_changesets == 'true' && github.event_name == 'workflow_run'
        run: |
          echo "🔄 Applying version updates from changesets..."

          # Apply version changes
          pnpm changeset version

          # Check if any files were modified
          if git diff --quiet; then
            echo "📝 No version changes applied"
            echo "version_updated=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Package versions updated"
            echo "version_updated=true" >> $GITHUB_OUTPUT

            # Commit version changes
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "chore: version packages [skip ci]"
            git push
          fi

      # ----------------------------------------
      # Sync version bump back to develop
      # ----------------------------------------
      - name: 🔄 Sync main back into develop
        if: steps.version_update.outputs.version_updated == 'true' && github.event_name == 'workflow_run'
        run: |
          echo "🔄 Merging version bump commit back into develop..."
          git fetch origin
          git checkout develop
          git merge --ff-only origin/main || git merge --no-ff --no-edit origin/main
          git push origin develop
          echo "✅ develop is now in sync with main"

      # ----------------------------------------
      # Manual Publishing Gate
      # ----------------------------------------
      - name: 🛡️ Manual Publishing Gate
        if: steps.version_update.outputs.version_updated == 'true' && github.event_name == 'workflow_run'
        run: |
          echo "🚨 PUBLISHING APPROVAL REQUIRED"
          echo "================================"
          echo ""
          echo "📦 Packages are ready to be published to NPM"
          echo "🏷️ Repository: ${{ github.repository }}"
          echo "🌟 Branch: ${{ github.ref_name }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo ""
          echo "⚠️  This action will publish packages to the PUBLIC NPM registry"
          echo "⚠️  This action CANNOT be undone once published"
          echo ""
          echo "🔗 To continue with publishing, manually re-run this workflow"
          echo "   with 'force_publish' set to true, or use:"
          echo ""
          echo "   gh workflow run version.yml --field force_publish=true"
          echo ""
          echo "❌ Stopping workflow - manual approval required"
          echo "✅ Versions have been updated and committed"
          echo "🔄 Re-run with force_publish=true to complete publishing"
          exit 1

      # ----------------------------------------
      # NPM Publishing (only with manual approval)
      # ----------------------------------------
      - name: 🏗️ Build Packages
        if: github.event.inputs.force_publish == 'true'
        run: pnpm build:packages

      - name: 🚀 Publish to NPM
        if: github.event.inputs.force_publish == 'true'
        run: |
          echo "🚀 Publishing packages to NPM registry..."
          pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ----------------------------------------
      # Success Notification
      # ----------------------------------------
      - name: 📢 Publish Notification
        if: github.event.inputs.force_publish == 'true'
        run: |
          echo "## 🎉 Packages Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following LCARS packages have been published to NPM:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Installation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @starfleet-technology/lcars@latest" >> $GITHUB_STEP_SUMMARY
          echo "npm install @starfleet-technology/lcars-react@latest" >> $GITHUB_STEP_SUMMARY
          echo "npm install @starfleet-technology/lcars-vue@latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Releases](../../releases) | 📦 [NPM Packages](https://www.npmjs.com/org/starfleet-technology)" >> $GITHUB_STEP_SUMMARY
